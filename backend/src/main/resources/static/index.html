<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SecureVault - Password Reset</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="shell">
    <section class="panel">
      <div class="brand">
        <div class="brand-mark">SV</div>
        <div>
          <h1>SecureVault</h1>
          <p>Password reset flow</p>
        </div>
      </div>

      <div class="steps">
        <div class="step active" data-step-indicator="request">1 Email</div>
        <div class="step" data-step-indicator="verify">2 OTP</div>
        <div class="step" data-step-indicator="reset">3 New Password</div>
      </div>

      <div id="message" class="message hidden"></div>

      <form id="requestForm" class="form active">
        <label for="email">Registered Email</label>
        <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required />
        <button type="submit">Send OTP</button>
      </form>

      <form id="verifyForm" class="form hidden">
        <label for="otp">OTP</label>
        <input id="otp" name="otp" type="text" inputmode="numeric" maxlength="6" placeholder="6-digit code" required />
        <button type="submit">Verify OTP</button>
        <button type="button" id="backToEmail" class="secondary">Change Email</button>
      </form>

      <form id="resetForm" class="form hidden">
        <label for="newPassword">New Password</label>
        <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" placeholder="Enter new password" required />
        <label for="confirmPassword">Confirm Password</label>
        <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" placeholder="Confirm new password" required />
        <button type="submit">Reset Password</button>
      </form>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
